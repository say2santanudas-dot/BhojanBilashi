name: Build Saanvi Daily APK

on:
  push:
    branches:
      - saanvi-daily-build-v21-20260925
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: SaanviDaily
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp SaanviDaily/app/build/outputs/apk/debug/app-debug.apk Saanvi_Daily_Full_v2.2.apk
          ls -lh Saanvi_Daily_Full_v2.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saanvi-Daily-Full-v2.2
          path: Saanvi_Daily_Full_v2.2.apk
          if-no-files-found: error
